<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .gallery-item {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: 200px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery-container">
        <div class="gallery-item"><img src="https://picsum.photos/id/1015/300/300" alt="Image 1"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1016/300/300" alt="Image 2"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1018/300/300" alt="Image 3"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1019/300/300" alt="Image 4"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1020/300/300" alt="Image 5"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1024/300/300" alt="Image 6"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1025/300/300" alt="Image 7"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1035/300/300" alt="Image 8"></div>
        <div class="gallery-item"><img src="https://picsum.photos/id/1038/300/300" alt="Image 9"></div>
    </div>

</body>
</html>
