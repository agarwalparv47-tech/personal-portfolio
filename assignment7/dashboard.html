<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
        }

        .dashboard-container {
            display: grid;
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 250px 1fr;
            grid-template-rows: 70px 1fr 50px;
            height: 100vh;
            gap: 0;
        }

        header {
            grid-area: header;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            font-size: 1.2rem;
            font-weight: bold;
        }

        aside {
            grid-area: sidebar;
            background-color: #2c3e50;
            color: white;
            padding: 1.5rem;
        }

        aside ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        aside ul li a {
            color: #b8c7ce;
            text-decoration: none;
        }

        aside ul li a:hover {
            color: white;
        }

        main {
            grid-area: main;
            background-color: #f4f4f9;
            padding: 2rem;
            color: #333;
        }

        footer {
            grid-area: footer;
            background-color: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            Dashboard Header
        </header>

        <aside>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Analytics</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>

        <main>
            <h2>Welcome Back, User!</h2>
            
        </main>

        <footer>
            &copy; 2026 Dashboard Application. All rights reserved.
        </footer>
    </div>

</body>
</html>
