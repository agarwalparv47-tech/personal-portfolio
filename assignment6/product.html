<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }

        .products-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
        }

        .product-card {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 220px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .product-img {
            background-color: #e0e0e0;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            color: #777;
            font-size: 0.9rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: bold;
            color: #333;
        }

        .product-price {
            color: #4CAF50;
            font-weight: bold;
        }

        .buy-btn {
            padding: 0.5rem;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background-color: #4CAF50;
        }
    </style>
</head>
<body>

    <h1>Our Products</h1>

    <div class="products-container">
        <div class="product-card">
            <div class="product-img">Image 1</div>
            <div class="product-title">Product One</div>
            <div class="product-price">$19.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 2</div>
            <div class="product-title">Product Two</div>
            <div class="product-price">$24.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 3</div>
            <div class="product-title">Product Three</div>
            <div class="product-price">$29.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 4</div>
            <div class="product-title">Product Four</div>
            <div class="product-price">$14.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 5</div>
            <div class="product-title">Product Five</div>
            <div class="product-price">$39.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 6</div>
            <div class="product-title">Product Six</div>
            <div class="product-price">$9.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 7</div>
            <div class="product-title">Product Seven</div>
            <div class="product-price">$49.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
        <div class="product-card">
            <div class="product-img">Image 8</div>
            <div class="product-title">Product Eight</div>
            <div class="product-price">$34.99</div>
            <button class="buy-btn">Buy Now</button>
        </div>
    </div>

</body>
</html>
