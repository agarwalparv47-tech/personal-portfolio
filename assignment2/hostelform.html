<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Admission Form</title>
</head>
<body>

    <h1>Hostel Admission Form</h1>
    <p>Please fill out all the required information to apply for hostel accommodation.</p>

    <form action="#" method="POST">

        <fieldset>
            <legend>Personal Information</legend>

            <p>
                <label for="full-name">Full Name:</label><br>
                <input type="text" id="full-name" name="full_name" placeholder="John" required minlength="3">
            </p>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            </p>

            <p>
                <label for="password">Create Portal Password:</label><br>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
            </p>

            <p>
                <label for="phone">Phone Number (10 digits):</label><br>
                <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required>
            </p>

            <p>
                <label for="social-url">Personal Portfolio/Profile URL:</label><br>
                <input type="url" id="social-url" name="social_url" placeholder="https://example.com">
            </p>

            <p>
                <label for="age">Age:</label><br>
                <input type="number" id="age" name="age" min="16" max="30" placeholder="18" required>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Hostel Preferences</legend>

            <p>
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </p>

            <p>
                <label for="room-type">Room Type:</label><br>
                <select id="room-type" name="room_type" required>
                    <option value="">-- Select Room Type --</option>
                    <option value="single">Single Sharing</option>
                    <option value="double">Double Sharing</option>
                    <option value="triple">Triple Sharing</option>
                </select>
            </p>

            <p>
                <label for="block-search">Preferred Hostel Block:</label><br>
                <input type="text" id="block-search" name="block" list="hostel-blocks" placeholder="Type or select block...">
                <datalist id="hostel-blocks">
                    <option value="Block A (Boys)">
                    <option value="Block B (Boys)">
                    <option value="Block C (Girls)">
                    <option value="Block D (Girls)">
                </datalist>
            </p>

            <p>
                <label>Facilities Required:</label><br>
                <input type="checkbox" id="facility-ac" name="facilities" value="ac">
                <label for="facility-ac">AC Room</label><br>
                <input type="checkbox" id="facility-mess" name="facilities" value="mess">
                <label for="facility-mess">Mess/Food Plan</label><br>
                <input type="checkbox" id="facility-laundry" name="facilities" value="laundry">
                <label for="facility-laundry">Laundry Service</label>
            </p>
        </fieldset>

        <br>

        <fieldset>
            <legend>Schedule & Additional Information</legend>

                <input type="date" id="move-in-date" name="move_in_date" required>
            </p>

            <p>
                <label for="check-in-time">Preferred Check-in Time:</label><br>
                <input type="time" id="check-in-time" name="check_in_time">
            </p>

            <p>
                <label for="id-proof">Upload ID Proof (PDF/JPG):</label><br>
                <input type="file" id="id-proof" name="id_proof" required>
            </p>

            <p>
                <label for="study-hours">Preferred Quiet/Study Hours (Scale 1-10):</label><br>
                <input type="range" id="study-hours" name="study_hours" min="1" max="10" value="5">
            </p>

            <p>
                <label for="bedsheet-color">Preferred Room Bedsheet Theme Color:</label><br>
                <input type="color" id="bedsheet-color" name="bedsheet_color" value="#3498db">
            </p>

            <p>
                <label for="medical-notes">Medical History / Special Instructions:</label><br>
                <textarea id="medical-notes" name="medical_notes" rows="4" cols="50" placeholder="Mention any allergies or medical requirements..."></textarea>
            </p>
        </fieldset>

        <br>

        <p>
            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>
        </p>

    </form>

</body>
</html>
